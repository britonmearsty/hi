# cargo-audit configuration.
#
# `hi` depends on `bincode` transitively through `syntect` (syntax
# highlighting). RUSTSEC-2025-0141 reports it as unmaintained; there are no
# known vulnerabilities. Ignore the informational notice so `cargo audit` in CI
# gates on real security advisories only, and revisit when it is replaced.
[advisories]
ignore = ["RUSTSEC-2025-0141"]